name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: entheogen-azure-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Azure package
        run: |
          rm -rf deploy-package
          mkdir deploy-package
          cp -R dist/. deploy-package/
          cp package.json server.js deploy-package/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: entheogen-azure-package
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://entheogen-research-mode-gpfuhxfae9f8hcgd.swedencentral-01.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: entheogen-azure-package
          path: deploy-package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: entheogen-research-mode
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package

      - name: Deploy to legacy Azure Web App URL
        uses: azure/webapps-deploy@v3
        with:
          app-name: entheogen
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ENTHEOGEN }}
          package: deploy-package
